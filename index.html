<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플러스탭 지시서 | 플러스탭</title>
  <style>
    :root{--side:248px;--point:#ff2e98;--soft:#fff0f7;--text:#181a1b;--line:#eceef1;--bg:#f4f5f7}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button{font:inherit}
    .app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%}
    .sidebar{z-index:20;display:flex;flex-direction:column;padding:28px 18px 20px;background:#fff;border-right:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:11px;padding:0 10px 28px;font-size:18px;font-weight:800;letter-spacing:-.03em}
    .brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--point);color:#fff;font-size:22px;box-shadow:0 7px 18px rgba(255,46,152,.22)}
    .nav-label{margin:0 12px 9px;color:#a0a5aa;font-size:11px;font-weight:700;letter-spacing:.08em}.nav{display:grid;gap:6px}
    .nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:11px;background:transparent;color:#555d64;text-align:left;cursor:pointer;transition:.16s}
    .nav-item:hover{background:#f7f7f8;color:var(--text);transform:translateX(2px)}.nav-item.active{background:var(--soft);color:var(--point);font-weight:700}
    .nav-icon{display:grid;place-items:center;width:20px;height:20px;flex:none}.nav-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .sidebar-footer{margin-top:auto;padding:18px 12px 0;border-top:1px solid var(--line);color:#a0a5aa;font-size:11px}
    .content{position:relative;min-width:0;height:100%}.page-frame{display:block;width:100%;height:100%;border:0;background:var(--bg)}.mobile-header,.backdrop{display:none}
    @media(max-width:760px){
      .app{display:block;height:100%;padding-top:58px}.mobile-header{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
      .menu-button{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:9px;background:transparent;cursor:pointer}.menu-button:hover{background:#f4f5f7}.menu-button svg{width:22px;height:22px}.mobile-title{font-size:15px;font-weight:750}
      .sidebar{position:fixed;inset:0 auto 0 0;width:min(82vw,var(--side));transform:translateX(-102%);box-shadow:14px 0 40px rgba(24,26,27,.12);transition:transform .22s}.app.menu-open .sidebar{transform:translateX(0)}
      .backdrop{position:fixed;inset:0;z-index:15;background:rgba(20,22,24,.36);opacity:0;pointer-events:none;transition:opacity .22s}.app.menu-open .backdrop{display:block;opacity:1;pointer-events:auto}.content{height:calc(100vh - 58px)}
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="mobile-header">
      <button class="menu-button" id="menuButton" type="button" aria-label="메뉴 열기" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="mobile-title" id="mobileTitle">플러스탭 지시서</span>
    </header>
    <aside class="sidebar" aria-label="주요 메뉴">
      <div class="brand"><span class="brand-mark" aria-hidden="true">+</span><span>플러스탭</span></div>
      <p class="nav-label">MENU</p>
      <nav class="nav">
        <button class="nav-item active" type="button" data-page="gen-task.html" data-title="플러스탭 지시서" aria-current="page">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg></span><span>플러스탭 지시서</span>
        </button>
        <button class="nav-item" type="button" data-page="plustab_components.html" data-title="플러스탭 컴포넌트">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span>플러스탭 컴포넌트</span>
        </button>
      </nav>
      <div class="sidebar-footer">PlusTab Design System</div>
    </aside>
    <button class="backdrop" id="backdrop" type="button" aria-label="메뉴 닫기"></button>
    <main class="content"><iframe class="page-frame" id="pageFrame" src="./gen-task.html" title="플러스탭 지시서"></iframe></main>
  </div>
  <script>
    const app=document.getElementById('app'),frame=document.getElementById('pageFrame'),menuButton=document.getElementById('menuButton'),backdrop=document.getElementById('backdrop'),mobileTitle=document.getElementById('mobileTitle'),navItems=[...document.querySelectorAll('.nav-item')];
    function closeMenu(){app.classList.remove('menu-open');menuButton.setAttribute('aria-expanded','false')}
    function selectPage(item){const title=item.dataset.title;frame.src='./'+item.dataset.page;frame.title=title;mobileTitle.textContent=title;document.title=title+' | 플러스탭';navItems.forEach(nav=>{const on=nav===item;nav.classList.toggle('active',on);on?nav.setAttribute('aria-current','page'):nav.removeAttribute('aria-current')});closeMenu()}
    navItems.forEach(item=>item.addEventListener('click',()=>selectPage(item)));
    menuButton.addEventListener('click',()=>{const open=app.classList.toggle('menu-open');menuButton.setAttribute('aria-expanded',String(open))});
    backdrop.addEventListener('click',closeMenu);window.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu()});
  </script>
</body>
</html>
